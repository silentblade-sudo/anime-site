<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Избранное — Anime Fan Club</title>
  <link rel="icon" href="../img/logo-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="../img/logo-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="../img/logo-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-red: #ff2440;
      --accent-orange: #ff2440;
      --bg-dark: #0d0607;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg-dark);
      color: #fff;
      /* глубокий чёрный с мягким бордовым отсветом сверху и снизу (вместо фото-пейзажа «фон аниме.jpg») */
      background-color: #0a0506;
      background-image: radial-gradient(ellipse 90% 480px at 50% -140px, rgba(150, 10, 28, 0.32), transparent 70%), radial-gradient(ellipse 70% 60% at 50% 110%, rgba(90, 6, 18, 0.25), transparent 70%);
      background-size: cover;
      background-attachment: fixed;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 36, 64, 0.2);
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      color: var(--accent-orange);
      text-shadow: 0 0 15px rgba(255, 36, 64, 0.3);
    }

    a.back {
      display: inline-block;
      margin-top: 15px;
      color: #bbb;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    a.back:hover { color: var(--accent-red); }

    .anime-list {
      box-sizing: border-box;
      max-width: min(1890px, calc(100% - 48px)); /* как широкий каталог: до 1600px, по краям не меньше 20px */
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(140, 10, 26, 0.45);
    }

    .anime-item {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .anime-poster {
      width: 100px;
      height: 140px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    .anime-info { flex: 1; }

    .anime-title {
      font-size: 20px;
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-orange);
      margin-bottom: 10px;
    }

    .remove-btn {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .remove-btn:hover {
      background: var(--accent-red);
      color: white;
      box-shadow: 0 0 10px var(--accent-red);
    }

    .empty-message {
      text-align: center;
      padding: 50px;
      font-size: 20px;
      color: #888;
    }

    .anime-list[hidden] { display: none; }

    /* Заголовки разделов — показываются, только когда в избранном есть и сериалы, и фильмы */
    .list-heading {
      margin: 0 0 10px;
      padding: 0 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: #ddd;
    }

    /* Фильмы (js/movie-favorites.js + js/movies-data.js) */
    a.anime-title { display: inline-block; text-decoration: none; }
    a.anime-title:hover { text-decoration: underline; }

    .movie-meta {
      margin: -4px 0 12px;
      font-size: 14px;
      color: #bbb;
    }

    .movie-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 15px;
      border: 1px solid var(--accent-orange);
      border-radius: 5px;
      color: var(--accent-orange);
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .open-btn:hover {
      background: #c8102e;
      border-color: #c8102e;
      color: #fff;
      box-shadow: 0 0 10px var(--accent-orange);
    }

    /* ───── Поиск и отбор по типу ───── */
    .fav-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: min(1890px, calc(100% - 48px));
      margin: 30px auto -10px;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .fav-toolbar[hidden],
    .anime-list[hidden] { display: none; }

    #favSearch {
      flex: 1 1 280px;
      min-width: 0;
      min-height: 44px;
      padding: 10px 20px;
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    #favSearch { max-width: 560px; }
    #favSearch::placeholder { color: #aaa; }

    #favSearch:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 12px rgba(255, 36, 64, 0.35);
    }

    .type-filter {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.35);
    }

    .type-btn {
      min-height: 36px;
      padding: 6px 16px;
      border: none;
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .type-btn:hover { color: #fff; background: rgba(255, 36, 64, 0.15); }

    .type-btn[aria-pressed="true"] {
      background: #c8102e;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 36, 64, 0.35);
    }

    .type-count {
      display: inline-block;
      min-width: 1.4em;
      margin-left: 4px;
      padding: 0 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.6;
    }

    .type-btn[aria-pressed="true"] .type-count { background: rgba(0, 0, 0, 0.25); }

    .fav-counter {
      flex-basis: 100%;
      margin: 0;
      text-align: center;
      font-size: 14px;
      color: #bbb;
    }

    .no-results { text-align: center; }
    .no-results .empty-message { padding: 20px 20px 16px; }

    .reset-btn {
      min-height: 44px;
      padding: 10px 22px;
      border: 1px solid var(--accent-orange);
      border-radius: 5px;
      background: transparent;
      color: var(--accent-orange);
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .reset-btn:hover {
      background: #c8102e;
      border-color: #c8102e;
      color: #fff;
      box-shadow: 0 0 10px var(--accent-orange);
    }

    @media (max-width: 480px) {
      .fav-toolbar { margin: 20px 10px -4px; padding: 0; }
      #favSearch { flex-basis: 100%; }
      .type-filter { width: 100%; box-sizing: border-box; }
      .type-btn { flex: 1; min-height: 40px; padding: 6px 8px; }

      /* фильмы — такая же компактная строка «постер + текст», как у сериалов (css/mobile.css) */
      #movieFavorites .anime-item { padding: 14px 4px; gap: 14px; }
      #movieFavorites .anime-poster { width: 80px; height: 112px; flex-shrink: 0; }
      #movieFavorites .anime-title { font-size: 17px; }
    }

    /* ───── Шапка: «На главную» и «В каталог» ───── */
    .fav-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 18px;
      margin-top: 15px;
    }
    .fav-nav a.back { margin-top: 0; }
    .catalog-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 36, 64, 0.5);
      border-radius: 999px;
      background: #c8102e;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 14px rgba(200, 16, 46, 0.35);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .catalog-link:hover { background: #e0152f; box-shadow: 0 0 20px rgba(255, 36, 64, 0.55); transform: translateY(-1px); }
    .empty-state { text-align: center; padding-bottom: 36px; }
    .empty-state .empty-message { padding-bottom: 20px; }
    .empty-state .catalog-link { min-height: 46px; padding: 10px 24px; font-size: 16px; }

    /* ───── Переключатель «Сетка / Список» (как на страницах жанров и в каталоге) ───── */
    .view-toggle {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.35);
    }
    .view-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 14px;
      border: 0;
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .view-btn svg { display: block; flex-shrink: 0; }
    .view-btn:hover { color: #fff; background: rgba(255, 36, 64, 0.15); }
    .view-btn[aria-pressed="true"] { background: #c8102e; color: #fff; box-shadow: 0 0 12px rgba(255, 36, 64, 0.35); }

    /* ───── Карточки: метаданные и описание ───── */
    .fav-meta { margin: -4px 0 10px; font-size: 14px; color: #bbb; }
    .fav-desc {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #d6c3c5;
    }
    .anime-item .anime-title { color: #ff2440; }
    a.anime-title:hover { color: #ff5a6e; }

    /* ───── Режим «Сетка»: постеры колонками, описание скрыто.
       :is(#…) — чтобы перебить правила css/mobile.css для #favoritesContainer ───── */
    :is(#favoritesContainer, #movieFavorites).fav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid[hidden] { display: none; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .list-heading { grid-column: 1 / -1; padding: 0; margin: 0; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .anime-item {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0;
      border: 1px solid #6e0a17;
      border-radius: 14px;
      background: #0a0506;
      overflow: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, box-shadow 0.2s;
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid .anime-item:hover {
      border-color: #c8102e;
      box-shadow: 0 8px 22px rgba(160, 8, 30, 0.45);
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid .anime-poster {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      aspect-ratio: 2 / 3;
      border-radius: 0;
      box-shadow: none;
      border-bottom: 1px solid rgba(140, 10, 26, 0.55);
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid .anime-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid .anime-title { font-size: 15px; margin-bottom: 6px; overflow-wrap: anywhere; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .fav-meta { margin: 0 0 10px; font-size: 12px; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .fav-desc { display: none; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .movie-actions { flex-direction: column; gap: 8px; margin-top: auto; }
    :is(#favoritesContainer, #movieFavorites).fav-grid .movie-actions > * {
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      min-height: 38px;
      padding: 7px 10px;
      font-size: 13px;
      text-align: center;
    }
    :is(#favoritesContainer, #movieFavorites).fav-grid .fade-out { transform: scale(0.92); }

    /* Режим «Список»: горизонтальная строка «постер + текст» с описанием */
    :is(#favoritesContainer, #movieFavorites):not(.fav-grid) .anime-item:last-child { border-bottom: 0; }

    /* смена вида — без анимаций */
    .fav-view-switching .anime-item,
    .fav-view-switching .anime-item * { transition: none !important; }

    @media (max-width: 768px) {
      .anime-list, .fav-toolbar { max-width: none; }
    }
    @media (max-width: 480px) {
      .view-toggle { width: 100%; box-sizing: border-box; }
      .view-btn { flex: 1; min-height: 40px; }
      :is(#favoritesContainer, #movieFavorites).fav-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      :is(#favoritesContainer, #movieFavorites).fav-grid .anime-info { padding: 9px; }
      :is(#favoritesContainer, #movieFavorites).fav-grid .anime-title { font-size: 14px; }
      :is(#favoritesContainer, #movieFavorites).fav-grid .movie-actions > * { min-height: 40px; font-size: 12px; padding: 6px; }
      :is(#favoritesContainer, #movieFavorites):not(.fav-grid) .fav-desc { -webkit-line-clamp: 2; line-clamp: 2; font-size: 13px; }
    }

    /* Анимация удаления */
    .fade-out {
      opacity: 0;
      transform: translateX(50px);
    }
  </style>
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/watch-modal.css">
  <link rel="stylesheet" href="../css/back-to-top.css">

  <link rel="stylesheet" href="../css/palette.css">

</head>
<body>

  <header>  
    <h1>★ Избранное</h1>
    <nav class="fav-nav" aria-label="Навигация">
      <a class="back" href="../index.html">← Вернуться на главную</a>
      <a class="catalog-link" href="movies.html">📚 В каталог</a>
      <a class="player-chip is-guest" data-player-chip href="login.html">👤 Вход</a>
    </nav>
  </header>

  <!-- Поиск и отбор по типу; скрыты, пока избранное пустое -->
  <div class="fav-toolbar" id="favToolbar" hidden>
    <input type="search" id="favSearch" placeholder="Поиск по названию..." aria-label="Поиск в избранном по названию" autocomplete="off">
    <div class="type-filter" role="group" aria-label="Что показывать">
      <button type="button" class="type-btn" data-type="all" aria-pressed="true">Все <span class="type-count"></span></button>
      <button type="button" class="type-btn" data-type="series" aria-pressed="false">Сериалы <span class="type-count"></span></button>
      <button type="button" class="type-btn" data-type="movies" aria-pressed="false">Фильмы <span class="type-count"></span></button>
    </div>
    <!-- Вид: тот же ключ localStorage animeverse_catalog_view, что в каталоге и на страницах жанров -->
    <div class="view-toggle" role="group" aria-label="Вид списка">
      <button type="button" class="view-btn" data-view="grid" aria-pressed="true" title="Сетка постеров">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        <span>Сетка</span>
      </button>
      <button type="button" class="view-btn" data-view="list" aria-pressed="false" title="Список с описанием">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><rect x="2" y="3" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="4" width="9" height="3" rx="1.5" fill="currentColor"/><rect x="2" y="12" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="13" width="9" height="3" rx="1.5" fill="currentColor"/></svg>
        <span>Список</span>
      </button>
    </div>
    <p class="fav-counter" id="favCounter" aria-live="polite"></p>
  </div>

  <section class="anime-list empty-state" id="favEmpty" hidden>
    <div class="empty-message">Тут пока пусто. Добавьте что-нибудь интересное!</div>
    <a class="catalog-link" href="movies.html">Перейти в каталог</a>
  </section>

  <section class="anime-list no-results" id="favNoResults" hidden>
    <div class="empty-message">Ничего не найдено</div>
    <button type="button" class="reset-btn" id="favReset">Сбросить фильтры</button>
  </section>

  <section class="anime-list" id="favoritesContainer" aria-label="Избранные аниме-сериалы" hidden></section>

  <section class="anime-list" id="movieFavorites" aria-label="Избранные аниме-фильмы" hidden></section>

  <script src="../js/movies-data.js"></script>
  <script src="../js/movie-favorites.js"></script>

  <script src="../js/watch-modal.js"></script>

    // ───────── Общие помощники ─────────
    // Сериалы: localStorage["favorites"] — массив названий (кнопки «В избранное» на страницах жанров).
    // Фильмы:  localStorage["favorite_movies"] — массив id из js/movies-data.js (js/movie-favorites.js).
    const MOVIE_LIST = typeof MOVIES !== 'undefined' && Array.isArray(MOVIES) ? MOVIES : [];

    // Регистр, «ё»/«е» и лишние пробелы не важны
    const normalize = text => String(text || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();

    function readSeries() {
      try {
        const list = JSON.parse(localStorage.getItem('favorites') || '[]');
        // ЗАЩИТА: пустые значения и "null" в списке пропускаем
        return Array.isArray(list) ? list.filter(t => typeof t === 'string' && t && t !== 'null') : [];
      } catch (e) {
        return [];
      }
    }

    function movieFavoriteIds() {
      return window.MovieFavorites ? MovieFavorites.list() : [];
    }

    function findMovie(id) {
      return MOVIE_LIST.find(m => m.id === id);
    }

    // Текст, по которому ищется фильм: русское, английское и оригинальное название
    function movieSearchText(id) {
      const movie = findMovie(id);
      return movie ? [movie.title, movie.titleEn, movie.titleOrig].join(' | ') : 'Фильм больше недоступен | ' + id;
    }

    // Путь постера в данных — от корня сайта; эта страница лежит в pages/
    function moviePosterSrc(poster) {
      if (!poster) return POSTER_PLACEHOLDER;
      return /^(https?:)?\/\//.test(poster) || poster.startsWith('/') ? poster : '../' + poster;
    }

    // Подробности сериалов (тип, год, описание, id для ссылки в каталог) — из data/anime.json, по id или названию.
    // Грузится один раз и только если в избранном есть сериалы; без него карточки показываются как раньше.
    const FORMAT_LABELS = { TV: 'ТВ-сериал', TV_SHORT: 'Короткий ТВ', OVA: 'OVA', ONA: 'ONA', SPECIAL: 'Спешл', MUSIC: 'Клип', MOVIE: 'Фильм' };
    let catalogInfo = null;
    let catalogLoading = false;
    function loadCatalogInfo() {
      if (catalogInfo || catalogLoading) return;
      catalogLoading = true;
      fetch('../data/anime.json')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          const byId = {}, byTitle = {};
          data.anime.forEach(a => {
            byId[a.id] = a;
            [a.title, a.titleEnglish, a.titleOriginal].forEach(t => { const k = normalize(t); if (k && !byTitle[k]) byTitle[k] = a; });
          });
          catalogInfo = { byId, byTitle };
          renderAll();
        })
        .catch(() => { /* без данных каталога — карточки без описания */ });
    }
    function findCatalogEntry(title, meta) {
      if (!catalogInfo) return null;
      return (meta && meta.id && catalogInfo.byId[meta.id]) || catalogInfo.byTitle[normalize(title)] || null;
    }

    function makeHeading(text) {
      const heading = document.createElement('h2');
      heading.className = 'list-heading';
      heading.textContent = text;
      return heading;
    }

    function makePoster(src, alt) {
      const img = document.createElement('img');
      img.className = 'anime-poster';
      img.alt = alt;
      img.loading = 'lazy';
      img.addEventListener('error', function onErr() {
        img.removeEventListener('error', onErr);
        img.src = POSTER_PLACEHOLDER;
      });
      img.src = src;
      return img;
    }

    // ───────── Сериалы ─────────
    function renderFavorites(titles, showHeading) {
      const container = document.getElementById('favoritesContainer');
      container.replaceChildren();
      container.hidden = titles.length === 0;
      if (!titles.length) return;
      if (showHeading) container.appendChild(makeHeading('Аниме-сериалы'));

      // Постеры тайтлов из каталога (data/anime.json) запоминает js/catalog-page.js при нажатии «В избранное»
      let catalogMeta = {};
      try { catalogMeta = JSON.parse(localStorage.getItem('animeverse_favorites_meta') || '{}') || {}; } catch (e) {}

      titles.forEach(title => {
        // Поиск постера: своя база → данные каталога → заглушка
        const meta = catalogMeta[title];
        const poster = (animeDatabase[title] && animeDatabase[title].img)
          || (meta && /^(https:\/\/|\.\.\/img\/)/.test(meta.poster) ? meta.poster : null)
          || POSTER_PLACEHOLDER;

        // Собираем карточку через DOM: названия из каталога могут содержать кавычки и спецсимволы
        const item = document.createElement('div');
        item.className = 'anime-item';
        item.dataset.noWatch = ''; // кнопку «Где посмотреть» ставим сами, ниже

        const info = document.createElement('div');
        info.className = 'anime-info';
        const entry = findCatalogEntry(title, meta);
        // название ведёт на страницу содержания тайтла, если он есть в каталоге
        const titleEl = document.createElement(entry ? 'a' : 'div');
        titleEl.className = 'anime-title';
        if (entry) titleEl.href = 'content.html?anime=' + encodeURIComponent(entry.id);
        titleEl.textContent = title;
        info.appendChild(titleEl);
        if (entry) {
          const metaLine = document.createElement('p');
          metaLine.className = 'fav-meta';
          metaLine.textContent = [FORMAT_LABELS[entry.format] || 'Сериал', entry.year].filter(Boolean).join(' • ');
          info.appendChild(metaLine);
          if (entry.synopsis) {
            const desc = document.createElement('p');
            desc.className = 'fav-desc';
            desc.textContent = entry.synopsis;
            info.appendChild(desc);
          }
        }

        const actions = document.createElement('div');
        actions.className = 'movie-actions';

        // «▶ Где посмотреть» — общее окно js/watch-modal.js (открывается само по классу watch-now-btn)
        const watchBtn = document.createElement('button');
        watchBtn.type = 'button';
        watchBtn.className = 'watch-now-btn';
        watchBtn.textContent = '▶ Где посмотреть';
        watchBtn.setAttribute('aria-haspopup', 'dialog');
        watchBtn.title = `Где посмотреть «${title}»`;
        watchBtn.dataset.titleRu = title;
        const orig = meta && meta.titleOriginal ? meta.titleOriginal : '';
        watchBtn.dataset.titleEn = orig || title;
        watchBtn.dataset.titleOrig = orig || title;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Удалить из списка';
        removeBtn.addEventListener('click', () => removeItem(removeBtn, title));

        actions.append(watchBtn, removeBtn);
        info.append(actions);
        item.append(makePoster(poster, title), info);
        container.appendChild(item);
      });
    }

    function removeItem(btn, title) {
      const item = btn.closest('.anime-item');
      item.classList.add('fade-out');

      setTimeout(() => {
        // Удаляем именно то название, на которое нажали
        const favorites = readSeries().filter(t => t !== title);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        renderAll();
      }, 400);
    }

    // ───────── Фильмы ─────────
    function renderMovieFavorites(ids, showHeading) {
      const section = document.getElementById('movieFavorites');
      section.replaceChildren();
      section.hidden = ids.length === 0;
      if (!ids.length) return;
      if (showHeading) section.appendChild(makeHeading('Аниме-фильмы'));

      ids.forEach(id => {
        const movie = findMovie(id);
        const item = document.createElement('div');
        item.className = 'anime-item';
        item.dataset.noWatch = ''; // у фильмов — «Подробнее и где смотреть» на странице фильма

        const info = document.createElement('div');
        info.className = 'anime-info';
        const actions = document.createElement('div');
        actions.className = 'movie-actions';

        if (movie) {
          const href = 'content.html?id=' + encodeURIComponent(movie.id);
          const titleEl = document.createElement('a');
          titleEl.className = 'anime-title';
          titleEl.href = href;
          titleEl.textContent = movie.title;
          const meta = document.createElement('p');
          meta.className = 'movie-meta fav-meta';
          meta.textContent = ['Фильм', movie.franchise, movie.year].filter(Boolean).join(' • ');
          const descText = Array.isArray(movie.description) ? movie.description[0] : movie.description;
          const open = document.createElement('a');
          open.className = 'open-btn';
          open.href = href;
          open.textContent = 'Подробнее и где смотреть';
          actions.appendChild(open);
          info.append(titleEl, meta);
          if (descText) {
            const desc = document.createElement('p');
            desc.className = 'fav-desc';
            desc.textContent = descText;
            info.appendChild(desc);
          }
        } else {
          // Фильм удалён из js/movies-data.js — оставляем возможность убрать его из списка
          const titleEl = document.createElement('div');
          titleEl.className = 'anime-title';
          titleEl.textContent = 'Фильм больше недоступен';
          const meta = document.createElement('p');
          meta.className = 'movie-meta fav-meta';
          meta.textContent = id;
          info.append(titleEl, meta);
        }

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Удалить из списка';
        removeBtn.addEventListener('click', () => {
          item.classList.add('fade-out');
          setTimeout(() => MovieFavorites.remove(id), 400); // onChange вызовет renderAll
        });
        actions.appendChild(removeBtn);

        info.appendChild(actions);
        const poster = movie ? moviePosterSrc(movie.poster) : POSTER_PLACEHOLDER;
        item.append(makePoster(poster, movie && movie.poster ? `Постер: ${movie.title}` : ''), info);
        section.appendChild(item);
      });
    }

    // ───────── Поиск и отбор по типу ─────────
    const toolbar = document.getElementById('favToolbar');
    const searchInput = document.getElementById('favSearch');
    const typeButtons = [...document.querySelectorAll('.type-btn')];
    const counter = document.getElementById('favCounter');
    const noResults = document.getElementById('favNoResults');
    const emptyAll = document.getElementById('favEmpty');
    let currentType = 'all';

    function setType(type) {
      currentType = type;
      typeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === type)));
      renderAll();
    }

    function resetFilters() {
      searchInput.value = '';
      setType('all');
      searchInput.focus();
    }

    function renderAll() {
      const series = readSeries();
      const movieIds = movieFavoriteIds();
      const total = series.length + movieIds.length;

      // Количество на кнопках — всего в избранном, без учёта поиска
      typeButtons.forEach(b => {
        const n = b.dataset.type === 'series' ? series.length : b.dataset.type === 'movies' ? movieIds.length : total;
        b.querySelector('.type-count').textContent = n;
      });

      // Избранное совсем пустое: прежнее сообщение, панель поиска скрыта
      emptyAll.hidden = total > 0;
      toolbar.hidden = total === 0;
      if (!total) {
        noResults.hidden = true;
        renderFavorites([], false);
        renderMovieFavorites([], false);
        return;
      }

      if (series.length) loadCatalogInfo();

      const query = normalize(searchInput.value);
      const shownSeries = currentType === 'movies' ? [] : series.filter(t => !query || normalize(t).includes(query));
      const shownMovies = currentType === 'series' ? [] : movieIds.filter(id => !query || normalize(movieSearchText(id)).includes(query));

      // Заголовки разделов — только в режиме «Все» и когда после фильтрации есть и сериалы, и фильмы
      const showHeadings = currentType === 'all' && shownSeries.length > 0 && shownMovies.length > 0;
      renderFavorites(shownSeries, showHeadings);
      renderMovieFavorites(shownMovies, showHeadings);

      const shown = shownSeries.length + shownMovies.length;
      noResults.hidden = shown > 0;
      const filtered = Boolean(query) || currentType !== 'all';
      counter.textContent = filtered ? `Найдено: ${shown} из ${total}` : `В избранном: ${total}`;
    }

    // ───────── Вид: «Сетка» (по умолчанию) / «Список» ─────────
    const VIEW_KEY = 'animeverse_catalog_view'; // общий с каталогом и страницами жанров
    const viewButtons = [...document.querySelectorAll('.view-btn')];
    function savedView() {
      try { return localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'grid'; } catch (e) { return 'grid'; }
    }
    function applyView(mode) {
      const grid = mode !== 'list';
      document.body.classList.add('fav-view-switching');
      ['favoritesContainer', 'movieFavorites'].forEach(id => document.getElementById(id).classList.toggle('fav-grid', grid));
      viewButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === (grid ? 'grid' : 'list'))));
      void document.body.offsetWidth;
      document.body.classList.remove('fav-view-switching');
    }
    viewButtons.forEach(b => b.addEventListener('click', () => {
      try { localStorage.setItem(VIEW_KEY, b.dataset.view); } catch (e) { /* приватный режим */ }
      applyView(b.dataset.view);
    }));
    window.addEventListener('storage', e => { if (e.key === VIEW_KEY) applyView(savedView()); });
    applyView(savedView());

    searchInput.addEventListener('input', renderAll);
    typeButtons.forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));
    document.getElementById('favReset').addEventListener('click', resetFilters);

    if (window.MovieFavorites) MovieFavorites.onChange(renderAll);
    // сериалы удалили в другой вкладке — тоже обновляемся
    window.addEventListener('storage', e => { if (e.key === 'favorites' || e.key === null) renderAll(); });

    renderAll();
  </script>
