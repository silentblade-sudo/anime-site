    <rect x="0" y="0" width="100" height="76" rx="10" stroke="#ff8b33" stroke-width="4"/>
    <path d="M12 0v76M88 0v76" stroke="#ff8b33" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M4 14h8M4 30h8M4 46h8M4 62h8M88 14h8M88 30h8M88 46h8M88 62h8" stroke="#ff8b33" stroke-width="3" stroke-opacity="0.75"/>
