  </defs>

  <rect width="280" height="400" fill="url(#bg)"/>
  <rect width="280" height="400" fill="url(#glow)"/>
  <rect x="6" y="6" width="268" height="388" rx="14" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7"/>

