      <stop offset="0" stop-color="#302825"/>
      <stop offset="0.55" stop-color="#1f1a18"/>
      <stop offset="1" stop-color="#171311"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
