<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="Genshin Impact — обложка Anime Fan Club">
  <!-- Собственная обложка Anime Fan Club (не официальный арт): звезда Тейвата и семь стихий -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1631"/>
      <stop offset="0.6" stop-color="#1c3564"/>
      <stop offset="1" stop-color="#3a2a1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#e6c27a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e6c27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#d6a84f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.75">
    <circle cx="50" cy="50" r="1.3"/><circle cx="330" cy="70" r="1.6"/><circle cx="270" cy="30" r="1"/><circle cx="90" cy="140" r="1"/>
    <circle cx="360" cy="190" r="1.3"/><circle cx="25" cy="260" r="1.1"/><circle cx="160" cy="24" r="1"/><circle cx="380" cy="300" r="1"/>
  </g>
  <circle cx="200" cy="240" r="200" fill="url(#halo)"/>
  <!-- орбита семи стихий -->
  <circle cx="200" cy="240" r="120" fill="none" stroke="#e6c27a" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="200" cy="240" r="132" fill="none" stroke="#e6c27a" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6"/>
  <g stroke="#0c1631" stroke-width="2">
    <circle cx="200" cy="120" r="15" fill="#74c2a8"/>  <!-- Анемо -->
    <circle cx="293.8" cy="165.2" r="15" fill="#f0b232"/>  <!-- Гео -->
    <circle cx="317" cy="266.7" r="15" fill="#b38dc1"/>  <!-- Электро -->
    <circle cx="252.1" cy="348.1" r="15" fill="#a5c83b"/>  <!-- Дендро -->
    <circle cx="147.9" cy="348.1" r="15" fill="#4cc2f1"/>  <!-- Гидро -->
    <circle cx="83" cy="266.7" r="15" fill="#ef7938"/>  <!-- Пиро -->
    <circle cx="106.2" cy="165.2" r="15" fill="#9fd6e3"/>  <!-- Крио -->
  </g>
  <!-- четырёхлучевая звезда -->
  <path d="M200 150 C206 216 214 228 280 240 C214 252 206 264 200 330 C194 264 186 252 120 240 C186 228 194 216 200 150 Z" fill="url(#gold)"/>
  <path d="M200 196 C203 228 208 235 244 240 C208 245 203 252 200 284 C197 252 192 245 156 240 C192 235 197 228 200 196 Z" fill="#fffaf0" opacity="0.9"/>
  <!-- силуэт гор и облака -->
  <path d="M0 450 L70 390 L120 420 L190 360 L250 410 L310 370 L400 430 L400 600 L0 600 Z" fill="#101a33" opacity="0.9"/>
  <path d="M0 470 Q100 440 200 470 T400 465 L400 600 L0 600 Z" fill="#0b1124"/>
  <text x="200" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" letter-spacing="5" fill="url(#gold)">GENSHIN</text>
  <text x="200" y="544" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#e6c27a">IMPACT</text>
  <text x="200" y="578" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#a9c4e8">СЕМЬ СТИХИЙ ТЕЙВАТА</text>
</svg>
