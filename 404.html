<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Anime Fan Club</title>
  <!-- Эта страница отдаётся по любому неверному адресу, поэтому все пути — от корня сайта -->
  <link rel="icon" href="/img/logo-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/img/logo-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      font-family: 'Roboto', sans-serif; color: #fff; text-align: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(200, 16, 46, 0.18), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 36, 64, 0.16), transparent 45%),
        linear-gradient(135deg, #0a0506 0%, #1a0b0e 55%, #170a0c 100%);
    }
    .card {
      width: 100%; max-width: 460px; padding: 36px 28px;
      background: rgba(22, 9, 11, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .code { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 72px; font-weight: 700; color: #c8102e; text-shadow: 0 0 20px rgba(200, 16, 46, 0.6); }
    h1 { margin: 8px 0 10px; font-family: 'Orbitron', sans-serif; font-size: 22px; color: #ff2440; }
    p { margin: 0 0 24px; color: #d9c6b8; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px;
      border-radius: 999px; font-weight: 700; text-decoration: none; transition: 0.3s;
    }
    .primary { background: #c8102e; color: #fff; box-shadow: 0 5px 20px rgba(200, 16, 46, 0.4); }
    .primary:hover { box-shadow: 0 0 25px rgba(200, 16, 46, 0.7); }
    .secondary { color: #ddd; border: 1px solid rgba(255, 36, 64, 0.4); }
    .secondary:hover { color: #fff; border-color: #ff2440; }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/palette.css">
</head>
<body>
  <main class="card">
    <p class="code">404</p>

    <div class="actions">
      <a class="primary" href="/">← На главную</a>
      <a class="secondary" href="/pages/ssylky.html">Моя коллекция</a>
    </div>
