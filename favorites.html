    :root {
      --accent-red: #ff5656;

    body {
      margin: 0;

      font-family: 'Roboto', sans-serif;
      background: var(--bg-dark);
      color: #fff;
      background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url("img/фон%20аниме.jpg");
      background-size: cover;
      background-attachment: fixed;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      color: var(--accent-gold);
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }

    a.back {
      display: inline-block;
      margin-top: 15px;
      color: #bbb;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    a.back:hover { color: var(--accent-red); }

    .anime-list {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .anime-item {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .anime-poster {
      width: 100px;
      height: 140px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    .anime-info { flex: 1; }

    .anime-title {
      font-size: 20px;
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .remove-btn {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .remove-btn:hover {
      background: var(--accent-red);
      color: white;
      box-shadow: 0 0 10px var(--accent-red);
    }

    .empty-message {
      text-align: center;
      padding: 50px;
      font-size: 20px;
      color: #888;
    }

    /* Анимация удаления */
    .fade-out {
      opacity: 0;
      transform: translateX(50px);
    }

    function renderFavorites() {
  const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
  const container = document.getElementById('favoritesContainer');
  container.innerHTML = "";

  if (favorites.length === 0) {
    container.innerHTML = '<div class="empty-message">Тут пока пусто. Добавьте что-нибудь интересное!</div>';
    return;
  }

  favorites.forEach(title => {
    // ЗАЩИТА: Если вдруг в список попал null или пустота, пропускаем его
    if (!title || title === "null") return;

    // Поиск данных в базе (учитываем регистр)
    const data = animeDatabase[title] || { img: "img/anime-logotip-1.webp" }; 
    
    const item = document.createElement('div');
    item.className = 'anime-item';
    // Используем специальные кавычки для удаления, чтобы названия с пробелами не ломались
    item.innerHTML = `
      <img src="${data.img}" alt="${title}" class="anime-poster" onerror="this.src='img/anime-logotip-1.webp'">
      <div class="anime-info">
        <div class="anime-title">${title}</div>
        <button class="remove-btn" onclick="removeItem(this, \`${title}\`)">Удалить из списка</button>
      </div>
    `;
    container.appendChild(item);
  });
}

function removeItem(btn, title) {
  const item = btn.closest('.anime-item');
  item.classList.add('fade-out');

  setTimeout(() => {
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    // Удаляем именно то название, на которое нажали
    favorites = favorites.filter(t => t !== title);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    renderFavorites();
  }, 400);
}

    renderFavorites();
